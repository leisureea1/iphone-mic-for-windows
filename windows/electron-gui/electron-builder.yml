appId: com.iphonemic.app
productName: iPhone Mic
directories:
  buildResources: build
  output: ../../dist
win:
  target: nsis
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  include: build/installer.nsh
  shortcutName: iPhone Mic
  createDesktopShortcut: true
  createStartMenuShortcut: true
extraResources:
  - from: ../build/bin/Release/iphone_mic_backend.dll
    to: .
  - from: ../build/bin/Release/iphone_asio_driver.dll
    to: .
